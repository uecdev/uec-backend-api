name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call: # reused by deploy.yml as the test gate

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: PHP tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: uec
          POSTGRES_PASSWORD: uec
          POSTGRES_DB: uec_api_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U uec" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: uec
      DB_PASSWORD: uec
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, intl, gd, bcmath, zip, sodium
          coverage: none
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/; s/^UEC_SURFACE=.*/UEC_SURFACE=all/' .env
          php artisan key:generate
      - name: Code style (Pint)
        run: vendor/bin/pint --test
      - name: Secret scan (no credentials committed)
        run: |
          ! git grep -nE '(sk_live_[A-Za-z0-9]{10,}|sk_test_[A-Za-z0-9]{20,}|-----BEGIN (RSA )?PRIVATE KEY-----|AKIA[0-9A-Z]{16})' -- ':!tests/*' ':!docs/*'
      - name: Tests
        run: php artisan test --parallel --processes=4
        env:
          DB_DATABASE: uec_api_test

  frontend:
    name: Admin assets (TypeScript + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', coverage: none }
      - run: composer install --prefer-dist --no-interaction --no-progress --no-scripts
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
