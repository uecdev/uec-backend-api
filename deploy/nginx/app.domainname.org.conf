# UEC administration dashboard — https://app.domainname.org  (UEC_SURFACE=admin)
# TLS certificates: certbot --nginx -d app.domainname.org
# Optional: restrict to office/VPN IPs with `allow …; deny all;` inside location /.

server {
    listen 80;
    listen [::]:80;
    server_name app.domainname.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.domainname.org;

    root /var/www/uec-admin/current/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/app.domainname.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.domainname.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Hymn audio uploads go through Livewire temporary uploads (≤ 50 MB).
    client_max_body_size 60m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/uec-admin.access.log;
    error_log  /var/log/nginx/uec-admin.error.log warn;

    # Fingerprinted Vite assets can be cached for a year.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known) { deny all; }
}
