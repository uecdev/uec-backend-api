# UEC REST API — https://api.domainname.org  (UEC_SURFACE=api)
# TLS certificates: certbot --nginx -d api.domainname.org

limit_req_zone $binary_remote_addr zone=uec_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.domainname.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.domainname.org;

    root /var/www/uec-api/current/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/api.domainname.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.domainname.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    # JSON bodies ≤ 1 MB are enforced by the app; multipart uploads (≤ 4 × 5 MB) need more.
    client_max_body_size 25m;

    # Offline bundles and the hymn catalogue are large JSON payloads.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/css application/javascript;

    access_log /var/log/nginx/uec-api.access.log;
    error_log  /var/log/nginx/uec-api.error.log warn;

    location / {
        limit_req zone=uec_api burst=40 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Webhooks must never be rate limited at the edge (gateways retry in bursts).
    location ^~ /api/v1/webhooks/ {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) { deny all; }
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
