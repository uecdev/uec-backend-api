# Queue workers — run on the API host (it owns webhooks, OTP and notifications).
# Priority order: otp (sign-up latency) > webhooks (payments) > notifications > default.
# Reload after each deploy: `php artisan queue:restart` (done by deploy.sh).

[program:uec-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/uec-api/current/artisan queue:work redis --queue=otp,webhooks,notifications,default --sleep=1 --tries=3 --backoff=10 --max-time=3600 --memory=256
directory=/var/www/uec-api/current
user=www-data
numprocs=3
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/log/uec/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

# Long-running push campaigns get a dedicated worker so they never delay OTPs.
[program:uec-worker-push]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/uec-api/current/artisan queue:work redis --queue=notifications --sleep=2 --tries=1 --timeout=1800 --max-time=7200 --memory=384
directory=/var/www/uec-api/current
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=1800
redirect_stderr=true
stdout_logfile=/var/log/uec/worker-push.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
